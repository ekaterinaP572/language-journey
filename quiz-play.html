<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 

  <title>Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="css/style.css">
    
</head>

<body>
  <div class="container" style="max-width: 1100px;">

  <div class="page-container mb-4">


    <main class="quiz-card">

      <h2 id="quiz-title" class="question-label text-center">Quiz Title</h2>

      <p id="quiz-progress" class="text-center">Question 1 of 10</p>

      <h3 id="question-text" class="question-text mb-4">
        The question
      </h3>

      <div id="question-image-container" class="question-image-card hidden">
    <img id="question-image" alt="Quiz image">
  </div>

      <div id="answer-container">
      The answer
      </div>

      <p id="feedback" class="question-text mb-4"></p>


      <div class="quiz-navigation">
        
<div class="navigation-left">
  <div class="card nav-card">
        <a href="index.html" class="text-decoration-none">
                <div class="card-body text-center">
                    <div class="fs-4 nav-card-body">🏠</div>
                    <h6 class="nav-title mt-0 mb-0 nav-card-body">Home</h6>
                </div>

        </a>
      </div>
  
             
              <div class="card nav-card text-center">
                <a id="quiz-button" class="text-decoration-none" >
                <div class="card-body text-center">
                  <div class="fs-4 nav-card-body">📝</div>
          <h6 class="nav-title mt-0 mb-0 nav-card-body">Quizzes</h6>
        </div>
          </a>
        </div>
      </div>
  
  <div class="navigation-right">

        <button id="repeat-button" class="nav-card">
          Try again
        </button>


        <button id="next-button" class="nav-card">
        
                <div class="card-body text-center">
                    <div class="fs-2">→</div>
                    <h6  class="mt-2 mb-0">Next</h6>
                
            </div>
        </button>
    </div>
    
    </div>

    </main>

  </div>

  
</div>

<footer class="footer mt-5">
  <p class="mb-1 fw-semibold">Language Journey 2026</p>
  <p class="text-muted mb-0">
  Made with ❤️ for language learners.</p>
</footer>

<script src="js/quizzes.js"></script>
  <script src="js/quiz.js"></script>

</body>
</html>
